<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Min-Max Media</title>
    <style>
        body{
            background-color: aqua;
            text-align: center;
            padding: 150px;
            background-size: cover;
        }
        @media(max-width:600px){
            body{
                background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYZtyLouzW4jPY5Nj2SJ6SIjge2ZKt9rqvQklCkwLH9A&s=10");
            }

        }
        @media (min-width:601px){
            body{
                background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVxX9DBN1bKObRN4oxQlrqCvdyRJmgoPz0IrH19s6vLQ&s=10");

            }
        }
    </style>
</head>
<body>
    <h2>Responsive Web Page</h2>
    <p>bg changes as the the width of the screen</p>
    
</body>
</html>
