<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body{
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: antiquewhite;
        }
        nav{
            background: blue;
            color: antiquewhite;
            padding: 30px;
            text-align: center;
        }
        .profile{
            text-align: center;
            padding: 20px;
        }
        .cards{
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .card{
            background: wheat;
            padding: 25px;
            width: 150px;
            text-align: center;
            border-radius: 20px;
        }
        @media(max-widhth:600px){
            .cards{
                flex-direction: column;
                align-items: center;
            }
            .card{
                width: 80%;
            }

        }
        @media (min-width:601px){
            .cards{
                flex-direction: row;
                
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Student dashboard</a>
        <a href="#">login</a>
        <a href="#">Home</a>
        <a href="#">Profile</a>
    </nav>
    <div class="profile">
        <h1>Student Profile</h1>
        <p>name: antara course: bsc cs </p>
    </div>
    <div class="cards">
        <div class="card">
            <h2>80%</h2>
            <p>Attendance</p>
        </div>    
        <div class="card">
            <h2>8.5</h2>
            <p>CGPA</p>
        </div>
        <div class="card">
            <h2>5</h2>
            <p>Projects</p>
        </div>
    </div>
    
</body>
</html>
