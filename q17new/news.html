<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>News</title>
    <style>
        body {
  margin: 0;
  font-family: Arial;
  background: #eee;
}

.news {
  display: flex;
  gap: 20px;
  padding: 20px;
}

.main {
  width: 60%;
  height: 300px;
  background: url("main.jpg") center/cover;
  color: white;
  padding: 20px;
  position: relative;
}

.main h1 {
  position: absolute;
  bottom: 20px;
  left: 20px;
  text-shadow: 2px 2px 4px black;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  width: 250px;
  padding: 15px;
  background: white;
  border: 2px solid #ccc;
  box-sizing: border-box;
}

.card h3 {
  margin: 0;
  color: navy;
}

.card p {
  font-size: 14px;
  line-height: 1.4;
}
    </style>
</head>
<body>
  <h1>Daily News</h1>

<div class="news">

  <div class="main">
    <h1>Today's Main News</h1>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Sports News</h3>
      <p>Latest updates from the world of sports.</p>
    </div>

    <div class="card">
      <h3>Technology</h3>
      <p>New technology and digital updates.</p>
    </div>

    <div class="card">
      <h3>Business</h3>
      <p>Important business and market news.</p>
    </div>
  </div>

</div>
</body>
</html>
