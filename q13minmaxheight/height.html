<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min-Max height</title>
    <style>
        body{
            background-color: aliceblue;
            padding: 30px;
            text-align: center;
            background-size: cover;
        }
        @media (max-height:600px){
            body{
                background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQL40qN8IlVxBpxJNRh77rdvVVbG5o5RCvIW5gh7rOi4Q&s=10");

            }
        }
        @media(min-height){
            body{
                background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbf-o5yXAIClirt6FxYCUjAIXEtfsQMr5_b-Ghf_Zu0A&s=10");
                
            }
        }
    </style>
</head>
<body>
    <h2>Responsive Web Page</h2>
    <p>bg changes as the the height of the screen</p>
    
</body>
</html>
