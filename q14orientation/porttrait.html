<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            text-align: center;
        }
        .orientation{
            height: 100vh;
            padding: 20px;
            background: hotpink;
        }
        @media (orientation: portrait){
            .orientation{
                background: lawngreen;
                text-align: end;
            }

        }
    </style>
</head>
<body>
    <div class="orientation">
        <h2>using orientation media query</h2>
        <p>using portrait or landscape</p>
    </div>
</body>
</html>
