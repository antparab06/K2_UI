<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
  font-family: Arial;
  text-align: center;
}
.container {
  width: 300px;
  height: 300px;
  margin: 100px auto;
  perspective: 600px;
}
.card {
  width: 250px;
  height: 200px;
  padding: 30px;
  box-sizing: border-box;
  background: lightblue;
  transition: 1s;
}
.card:hover {
  transform: rotateX(20deg) rotateY(25deg) rotateZ(10deg) translate(20px,20px) skew(5deg) scale(1.1);
}
</style>
</head>
<body>
    <h1>3D Interactive Card</h1>

<div class="container">
  <div class="card">
    <h2>3D Card</h2>
    <p>Move your mouse over me.</p>
  </div>
</div>

</body>
</html>
