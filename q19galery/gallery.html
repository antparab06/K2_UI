    <title>Document</title>
    <style>

.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
}
.gallery img {
  width: 220px;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
}
@media (max-width: 700px) {
  .gallery img {
    width: 45%;

}
@media (max-width: 450px) {
  .gallery img {
    width: 90%;
  }
}

</head>
