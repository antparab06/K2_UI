<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Sticky</title>
</head>
<style>
    nav{
        position: sticky;
        top: 0;
        background: brown;
        padding: 15px;
    }
    nav a{
        color: beige;
        margin: 20px;
    }
    section{
        height: 300px;
        padding: 25px;
    }
    #home{
        background: hotpink;color: cadetblue;
    }
    #about{
        background: palegreen;color: chocolate;
    }
    #servies{
        background:violet;color: antiquewhite;
    }
    #register{
        background: tomato;color:palegreen;
    }
    #contact{
        background: lavender;color: aqua;
    }
</style>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">AboutUS</a>
        <a href="#contact">Contact</a>
        <a href="#services">Services</a>
        <a href="#register">Register</a>
    </nav>
    <section id="home">
        <h1>Home</h1>
        <p>Welcome to the home page</p>
    </section>
    <section id="about">
        <h1>AboutUS</h1>
        <p>Find more information about us</p>
    </section>
    <section id="conatct">
        <h1>ContactUS</h1>
        <p>contact numbers for the website</p>
    </section>
    <section id="services">
        <h1>Services</h1>
        <p>Services we provide</p>
    </section>
    <section id="register">
        <h1>Register</h1>
        <p>Register with us</p>
    </section>
</body>
</html>
