<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
  font-family: Arial;
  background: #f5f5f5;
  color: #222;
  margin: 20px;
}

h1 {
  font-size: 35px;
  text-align: center;
  letter-spacing: 2px;
}

.skills {
  text-align: center;
  font-weight: bold;
  font-style: italic;
  line-height: 2;
}

.projects {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.card {
  background: white;
  padding: 20px;
  width: 200px;
  text-align: center;
  border-radius: 10px;
}

.card h2 {
  font-size: 22px;
  color: navy;
}

.card p {
  font-size: 15px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .projects {
    flex-direction: column;
    align-items: center;
  }
}
    </style>
</head>
<body>
    <h1>Professional Skills & Projects</h1>

<div class="skills">
  <p>HTML CSS Java Python SQL</p>
</div>

<div class="projects">

  <div class="card">
    <h2>Portfolio</h2>
    <p>Personal portfolio website using HTML and CSS.</p>
  </div>

  <div class="card">
    <h2>Student App</h2>
    <p>Student management application using Java.</p>
  </div>

  <div class="card">
    <h2>Travel Planner</h2>
    <p>A simple travel planning project using web technologies.</p>
  </div>

</div>    
</body>
</html>
